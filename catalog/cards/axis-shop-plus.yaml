- id: sp-apparel
  scope:
    type: category
    value: apparel
  multiplier: 5
  basis: total
  cap:
    type: spend
    value: 10000
    window: statement_cycle
  post_cap: 1
  priority: 3
- id: sp-electronics
  scope:
    type: category
    value: electronics
  multiplier: 5
  basis: total
  cap:
    type: spend
    value: 10000
    window: statement_cycle
  post_cap: 1
  priority: 3
